<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Studio · 现代 AI 绘图工作站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <script>
    // 屏蔽 Tailwind CDN 生产环境提示
    const _warn = console.warn;
    console.warn = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _warn.apply(console, args);
    };
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          boxShadow: {
            'glow': '0 0 30px -5px rgba(99, 102, 241, 0.45)',
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.02); }
    }
    .animate-pulse-glow { animation: pulse-glow 3s infinite ease-in-out; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white font-sans antialiased">

  <!-- 顶部导航栏 -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">SD Studio</span>
          <span class="text-xs px-2 py-0.5 ml-2 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono">3055 Express</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="/api/docs" target="_blank" class="hidden sm:flex items-center gap-1.5 text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg hover:bg-slate-800 transition">
          <i data-lucide="code-2" class="w-4 h-4"></i> API 文档
        </a>
        <div class="h-4 w-px bg-slate-800 hidden sm:block"></div>
        <div class="flex items-center gap-2 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-500/20 px-3 py-1.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-medium">AI 绘图服务在线</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主工作区 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- 左侧控制面板 (5 列) -->
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl shadow-xl space-y-5">
          
          <!-- 模型选择器 -->
          <div>
            <label class="text-xs font-semibold text-slate-300 flex items-center justify-between mb-2">
              <span class="flex items-center gap-1.5">
                <i data-lucide="cpu" class="w-3.5 h-3.5 text-indigo-400"></i> 生图模型 (Model)
              </span>
              <span class="text-[10px] text-emerald-400 font-mono">炸天帮 API</span>
            </label>
            <select id="modelSelect" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono cursor-pointer transition">
              <option value="gemini-3.1-flash-image-4K" selected>💎 gemini-3.1-flash-image-4K (4K 旗舰超清 · 推荐)</option>
              <option value="gemini-3.1-flash-image-2K">✨ gemini-3.1-flash-image-2K (2K 高清画质)</option>
              <option value="gemini-3.1-flash-image">⚡ gemini-3.1-flash-image (1K 标准画质)</option>
            </select>
          </div>

          <!-- 提示词输入框 -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-sm font-semibold text-slate-200 flex items-center gap-1.5">
                <i data-lucide="wand-2" class="w-4 h-4 text-indigo-400"></i> 正向提示词 (Prompt)
              </label>
              <button onclick="clearPrompt()" class="text-xs text-slate-500 hover:text-slate-300 transition">清空</button>
            </div>
            <textarea id="promptInput" rows="4" 
              placeholder="输入你想要的画面，支持中文或英文..." 
              class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition resize-none leading-relaxed">a cute cyberpunk cat with neon sunglasses sitting on city roof, rain, 8k resolution</textarea>
            
            <!-- 预设灵感标签 -->
            <div class="mt-2.5 flex flex-wrap gap-1.5">
              <span class="text-xs text-slate-500 self-center mr-1">灵感:</span>
              <button onclick="setQuickPrompt('赛博朋克霓虹城市夜景，雨夜倒影，高楼大厦，电影级光影，8k高清')" class="text-xs bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-1 rounded-md border border-slate-700/50 transition">赛博夜景</button>
              <button onclick="setQuickPrompt('穿着宇航服在深邃宇宙中漂浮的可爱猫咪，璀璨星系，杰作，8k')" class="text-xs bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-1 rounded-md border border-slate-700/50 transition">宇航猫咪</button>
              <button onclick="setQuickPrompt('银发二次元美少女，樱花飞舞，夕阳海滩，唯美吉卜力风格')" class="text-xs bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-1 rounded-md border border-slate-700/50 transition">唯美动漫</button>
              <button onclick="setQuickPrompt('3D可爱生肖龙盲盒手办，光滑塑料质感，马卡龙柔和色调，摄影级柔光，Octane渲染')" class="text-xs bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-1 rounded-md border border-slate-700/50 transition">3D盲盒</button>
            </div>
          </div>

          <!-- 折叠反向提示词 -->
          <div>
            <button onclick="toggleNegative()" class="flex items-center justify-between w-full text-xs text-slate-400 hover:text-slate-200 transition py-1">
              <span class="flex items-center gap-1.5 font-medium"><i data-lucide="shield-alert" class="w-3.5 h-3.5 text-slate-400"></i> 反向提示词 (Negative Prompt)</span>
              <i id="negChevron" data-lucide="chevron-down" class="w-4 h-4 transition-transform"></i>
            </button>
            <div id="negativeWrapper" class="hidden mt-2">
              <textarea id="negativeInput" rows="2" 
                placeholder="不希望出现的元素，如：lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, worst quality..." 
                class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition resize-none"></textarea>
            </div>
          </div>

          <!-- 画幅比例与分辨率选择 -->
          <div>
            <label class="text-sm font-semibold text-slate-200 flex items-center gap-1.5 mb-2.5">
              <i data-lucide="proportions" class="w-4 h-4 text-indigo-400"></i> 画幅比例
            </label>
            <div class="grid grid-cols-4 gap-2 text-center" id="ratioSelector">
              <button type="button" data-w="1024" data-h="1024" onclick="selectRatio(this)" class="ratio-btn bg-indigo-600/20 border-indigo-500/80 text-white border p-2.5 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1">
                <span class="w-5 h-5 border border-current rounded flex items-center justify-center text-[10px]">1:1</span>
                <span>正方形</span>
                <span class="text-[10px] text-slate-400 font-mono">1024x1024</span>
              </button>
              <button type="button" data-w="1280" data-h="720" onclick="selectRatio(this)" class="ratio-btn bg-slate-950/60 border-slate-800 text-slate-400 hover:text-slate-200 border p-2.5 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1">
                <span class="w-6 h-3.5 border border-current rounded flex items-center justify-center text-[9px]">16:9</span>
                <span>横屏壁纸</span>
                <span class="text-[10px] text-slate-500 font-mono">1280x720</span>
              </button>
              <button type="button" data-w="720" data-h="1280" onclick="selectRatio(this)" class="ratio-btn bg-slate-950/60 border-slate-800 text-slate-400 hover:text-slate-200 border p-2.5 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1">
                <span class="w-3.5 h-6 border border-current rounded flex items-center justify-center text-[9px]">9:16</span>
                <span>手机壁纸</span>
                <span class="text-[10px] text-slate-500 font-mono">720x1280</span>
              </button>
              <button type="button" data-w="1024" data-h="768" onclick="selectRatio(this)" class="ratio-btn bg-slate-950/60 border-slate-800 text-slate-400 hover:text-slate-200 border p-2.5 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1">
                <span class="w-5 h-4 border border-current rounded flex items-center justify-center text-[9px]">4:3</span>
                <span>标准画幅</span>
                <span class="text-[10px] text-slate-500 font-mono">1024x768</span>
              </button>
            </div>
          </div>

          <!-- 生成按钮 -->
          <button id="generateBtn" onclick="handleGenerate()" 
            class="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] text-white shadow-lg shadow-indigo-600/30 hover:shadow-indigo-500/40 transition-all flex items-center justify-center gap-2 group cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            <i data-lucide="sparkles" class="w-5 h-5 group-hover:rotate-12 transition-transform"></i>
            <span>立即生成图片</span>
          </button>
        </div>

        <!-- 极简直接调用示例 -->
        <div class="bg-slate-900/50 border border-slate-800/60 rounded-xl p-4 text-xs space-y-2 text-slate-400">
          <div class="flex items-center justify-between text-slate-300 font-medium">
            <span class="flex items-center gap-1.5"><i data-lucide="terminal" class="w-4 h-4 text-indigo-400"></i> 极简直接调用</span>
            <span class="text-[11px] text-indigo-400 font-mono">浏览器直出图片</span>
          </div>
          <p class="leading-relaxed">可在网页或浏览器中直接写链接出图：</p>
          <div class="bg-slate-950 p-2.5 rounded-lg font-mono text-[11px] text-slate-300 break-all select-all border border-slate-800/80">
            http://<span class="host-placeholder">localhost:3055</span>/image?prompt=cat
          </div>
        </div>
      </div>

      <!-- 右侧当前视口展示区 (7 列) -->
      <div class="lg:col-span-7 space-y-6">
        <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl shadow-xl flex flex-col min-h-[520px]">
          
          <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800/80">
            <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
              <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i> 画布视口 (当前生图任务)
            </h3>
            <div id="metaBadge" class="hidden text-xs px-2.5 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-slate-300 font-mono">
              --
            </div>
          </div>

          <!-- 图片展示与加载视口 -->
          <div id="displayViewport" class="flex-1 rounded-xl bg-slate-950/80 border border-slate-800/60 flex items-center justify-center p-4 relative overflow-hidden group min-h-[380px]">
            
            <!-- 默认空状态 -->
            <div id="emptyState" class="text-center space-y-3 max-w-sm py-12">
              <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto">
                <i data-lucide="palette" class="w-8 h-8"></i>
              </div>
              <h4 class="text-slate-200 font-semibold text-base">准备创作</h4>
              <p class="text-xs text-slate-400 leading-relaxed">在左侧输入你的灵感提示词，点击“立即生成图片”，当前任务的作品将在这里呈现。</p>
            </div>

            <!-- 加载状态动画 -->
            <div id="loadingState" class="hidden text-center space-y-4 py-16">
              <div class="relative w-20 h-20 mx-auto">
                <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-indigo-400">
                  <i data-lucide="sparkles" class="w-7 h-7 animate-pulse"></i>
                </div>
              </div>
              <div class="space-y-1">
                <h4 class="text-slate-200 font-semibold">AI 正在绘制画面...</h4>
                <p class="text-xs text-slate-400">已耗时 <span id="timerText" class="font-mono text-indigo-400 font-bold">0.0s</span> (自动重试容错已开启)</p>
              </div>
            </div>

            <!-- 错误状态提示卡片 -->
            <div id="errorState" class="hidden text-center space-y-4 py-10 max-w-md px-4">
              <div class="w-14 h-14 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-7 h-7"></i>
              </div>
              <div class="space-y-1">
                <h4 class="text-slate-200 font-semibold">生图未成功</h4>
                <p id="errorMsgText" class="text-xs text-rose-400/90 font-mono bg-rose-950/30 border border-rose-500/20 p-2.5 rounded-lg break-all"></p>
              </div>
              <button onclick="handleGenerate()" class="px-5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 立即重试
              </button>
            </div>

            <!-- 生成的图片展示 -->
            <img id="resultImage" class="hidden max-h-[600px] w-auto max-w-full rounded-lg object-contain shadow-2xl transition duration-300 cursor-zoom-in" onclick="openLightbox(this.src)" alt="Generated Output">
          </div>

          <!-- 快捷操作栏 (生成后出现) -->
          <div id="actionToolbar" class="hidden mt-4 pt-4 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <button onclick="openLightbox()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center gap-1.5 transition">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> 全屏预览
              </button>
              <button onclick="downloadImage()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium flex items-center gap-1.5 shadow-md shadow-indigo-600/20 transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> 下载原图
              </button>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="copyImageUrl()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center gap-1.5 transition">
                <i data-lucide="link" class="w-3.5 h-3.5"></i> 复制图片链接
              </button>
              <button onclick="copyPrompt()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center gap-1.5 transition">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i> 复制提示词
              </button>
            </div>
          </div>
        </div>

        <!-- 本次会话生成历史 -->
        <div class="bg-slate-900/50 border border-slate-800/60 rounded-2xl p-5">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
              <i data-lucide="history" class="w-3.5 h-3.5 text-indigo-400"></i> 最近生成记录 (<span id="historyCount">0</span>)
              <span class="text-[11px] text-slate-500 font-normal ml-1">· 点击弹出详情，不影响当前任务</span>
            </h4>
            <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-rose-400 transition">清空记录</button>
          </div>
          <div id="historyGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
            <!-- 历史缩略图动态插入 -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- 历史图片弹出查看窗口 (独立 Modal，不挤占主视口) -->
  <!-- ========================================================================= -->
  <div id="historyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 sm:p-6" onclick="closeHistoryModal()">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
      
      <!-- 弹窗标题栏 -->
      <div class="px-5 py-3.5 border-b border-slate-800/90 flex items-center justify-between bg-slate-900/80">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
          <h3 class="text-sm font-semibold text-slate-200">生成历史详情</h3>
          <span id="modalMetaBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">--</span>
        </div>
        <button onclick="closeHistoryModal()" class="w-8 h-8 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition cursor-pointer" title="关闭窗口 (ESC)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 弹窗主体区 (图 + 信息) -->
      <div class="p-5 overflow-y-auto flex-1 space-y-4">
        <!-- 大图展示 -->
        <div class="rounded-xl bg-slate-950 border border-slate-800/80 flex items-center justify-center overflow-hidden min-h-[260px] max-h-[500px]">
          <img id="modalImage" class="max-h-[500px] w-auto max-w-full object-contain cursor-zoom-in" onclick="openLightbox(this.src)" alt="Historical Image">
        </div>

        <!-- 提示词展示卡片 -->
        <div class="bg-slate-950/70 border border-slate-800/70 rounded-xl p-3.5 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
              <i data-lucide="file-text" class="w-3.5 h-3.5 text-indigo-400"></i> 生成提示词:
            </span>
            <button onclick="copyModalPrompt()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition">
              <i data-lucide="copy" class="w-3 h-3"></i> 复制提示词
            </button>
          </div>
          <p id="modalPromptText" class="text-xs text-slate-300 leading-relaxed font-mono select-all bg-slate-900/60 p-2 rounded-lg border border-slate-800/60"></p>
        </div>
      </div>

      <!-- 弹窗底部操作条 -->
      <div class="px-5 py-3 border-t border-slate-800/90 bg-slate-900/60 flex flex-wrap items-center justify-between gap-3">
        <button onclick="applyModalPrompt()" class="px-3.5 py-2 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-medium flex items-center gap-1.5 transition cursor-pointer">
          <i data-lucide="arrow-left-circle" class="w-4 h-4"></i> 填入并复用此提示词
        </button>

        <div class="flex items-center gap-2">
          <button onclick="copyModalImageUrl()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center gap-1.5 transition cursor-pointer">
            <i data-lucide="link" class="w-3.5 h-3.5"></i> 复制图片直链
          </button>
          <button onclick="downloadModalImage()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 transition cursor-pointer">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> 下载原图
          </button>
          <button onclick="closeHistoryModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition cursor-pointer">
            关闭
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 全屏灯箱 (用于极大大图全屏缩放) -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeLightbox()">
    <button class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition cursor-pointer" onclick="closeLightbox()">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    <img id="lightboxImg" class="max-w-full max-h-[92vh] rounded-xl shadow-2xl object-contain" onclick="event.stopPropagation()" alt="Full view">
  </div>

  <!-- Toast 提示框 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 border border-slate-700 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2">
    <i id="toastIcon" data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">成功</span>
  </div>

  <!-- 页面交互逻辑脚本 -->
  <script>
    lucide.createIcons();

    document.querySelectorAll('.host-placeholder').forEach(el => {
      el.innerText = window.location.host;
    });

    let currentImageData = null;
    let modalImageData = null;
    let selectedW = 1024;
    let selectedH = 1024;
    let timerInterval = null;
    let historyList = JSON.parse(localStorage.getItem('sd_history') || '[]');

    renderHistory();

    // 监听键盘 ESC 键，随时可快速关闭弹窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeHistoryModal();
        closeLightbox();
      }
    });

    function setQuickPrompt(text) {
      document.getElementById('promptInput').value = text;
      document.getElementById('promptInput').focus();
    }

    function clearPrompt() {
      document.getElementById('promptInput').value = '';
      document.getElementById('promptInput').focus();
    }

    function toggleNegative() {
      const wrap = document.getElementById('negativeWrapper');
      const chev = document.getElementById('negChevron');
      wrap.classList.toggle('hidden');
      chev.classList.toggle('rotate-180');
    }

    function selectRatio(btn) {
      document.querySelectorAll('.ratio-btn').forEach(b => {
        b.className = "ratio-btn bg-slate-950/60 border-slate-800 text-slate-400 hover:text-slate-200 border p-2.5 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1";
      });
      btn.className = "ratio-btn bg-indigo-600/20 border-indigo-500/80 text-white border p-2.5 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1";
      selectedW = Number(btn.getAttribute('data-w'));
      selectedH = Number(btn.getAttribute('data-h'));
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.innerText = msg;
      toastIcon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
      toastIcon.className = `w-4 h-4 ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
      lucide.createIcons();

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    async function handleGenerate() {
      const prompt = document.getElementById('promptInput').value.trim();
      const negative_prompt = document.getElementById('negativeInput').value.trim();

      if (!prompt) {
        showToast('请输入提示词 (Prompt)', true);
        return document.getElementById('promptInput').focus();
      }

      const generateBtn = document.getElementById('generateBtn');
      const emptyState = document.getElementById('emptyState');
      const loadingState = document.getElementById('loadingState');
      const errorState = document.getElementById('errorState');
      const errorMsgText = document.getElementById('errorMsgText');
      const resultImage = document.getElementById('resultImage');
      const actionToolbar = document.getElementById('actionToolbar');
      const metaBadge = document.getElementById('metaBadge');
      const timerText = document.getElementById('timerText');

      generateBtn.disabled = true;
      emptyState.classList.add('hidden');
      errorState.classList.add('hidden');
      resultImage.classList.add('hidden');
      actionToolbar.classList.add('hidden');
      loadingState.classList.remove('hidden');

      const startTime = Date.now();
      timerText.innerText = '0.0s';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerText.innerText = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
      }, 100);

      try {
        const model = document.getElementById('modelSelect')?.value || 'gemini-3.1-flash-image-4K';
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            negative_prompt,
            model,
            width: selectedW,
            height: selectedH
          })
        });

        const data = await response.json();
        clearInterval(timerInterval);

        const imgUrl = data.url || (data.images && data.images.length ? ('data:image/jpeg;base64,' + data.images[0]) : null);

        if (response.ok && data.success && imgUrl) {
          const cost = ((Date.now() - startTime) / 1000).toFixed(1);
          
          currentImageData = {
            url: imgUrl,
            prompt,
            cost,
            model: data.model || model,
            dimensions: `${selectedW}x${selectedH}`,
          };

          resultImage.src = imgUrl;
          resultImage.classList.remove('hidden');
          actionToolbar.classList.remove('hidden');
          
          metaBadge.innerText = `${data.model || model} · ${cost}s`;
          metaBadge.classList.remove('hidden');

          saveToHistory(currentImageData);
          showToast(`生成成功！耗时 ${cost} 秒`);
        } else {
          errorState.classList.remove('hidden');
          errorMsgText.innerText = data.error || ('HTTP ' + response.status + ': 生成失败');
          showToast(data.error || '生成失败，请重试', true);
        }
      } catch (err) {
        clearInterval(timerInterval);
        errorState.classList.remove('hidden');
        errorMsgText.innerText = '网络异常: ' + err.message;
        showToast('请求异常: ' + err.message, true);
      } finally {
        loadingState.classList.add('hidden');
        generateBtn.disabled = false;
        lucide.createIcons();
      }
    }

    function saveToHistory(item) {
      historyList.unshift(item);
      if (historyList.length > 24) historyList.pop();
      localStorage.setItem('sd_history', JSON.stringify(historyList));
      renderHistory();
    }

    function renderHistory() {
      const grid = document.getElementById('historyGrid');
      const count = document.getElementById('historyCount');
      count.innerText = historyList.length;
      grid.innerHTML = '';

      if (historyList.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-4 text-center text-slate-600 text-xs">暂无历史记录</div>';
        return;
      }

      historyList.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = "aspect-square rounded-xl overflow-hidden bg-slate-950 border border-slate-800 hover:border-indigo-500/80 cursor-pointer transition relative group";
        div.innerHTML = `
          <img src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-[10px] p-1 text-center font-medium">
            <span class="bg-indigo-600/80 px-1.5 py-0.5 rounded text-[9px]">查看</span>
          </div>
        `;
        // 改为弹出独立窗口查看，不干扰当前视口任务
        div.onclick = () => openHistoryModal(item);
        grid.appendChild(div);
      });
    }

    // =========================================================================
    // 独立历史弹窗逻辑 (不替换当前画布)
    // =========================================================================
    function openHistoryModal(item) {
      modalImageData = item;
      document.getElementById('modalImage').src = item.url;
      document.getElementById('modalPromptText').innerText = item.prompt;
      document.getElementById('modalMetaBadge').innerText = `${item.dimensions || '1024x1024'} · ${item.cost || '?'}s`;
      
      const modal = document.getElementById('historyModal');
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeHistoryModal() {
      const modal = document.getElementById('historyModal');
      if (modal) modal.classList.add('hidden');
    }

    function applyModalPrompt() {
      if (!modalImageData) return;
      document.getElementById('promptInput').value = modalImageData.prompt;
      closeHistoryModal();
      document.getElementById('promptInput').focus();
      showToast('已填入提示词到输入框');
    }

    function copyModalPrompt() {
      if (!modalImageData) return;
      navigator.clipboard.writeText(modalImageData.prompt).then(() => {
        showToast('提示词已复制到剪贴板');
      });
    }

    function copyModalImageUrl() {
      if (!modalImageData) return;
      navigator.clipboard.writeText(modalImageData.url).then(() => {
        showToast('图片直链已复制');
      });
    }

    function downloadModalImage() {
      if (!modalImageData) return;
      const a = document.createElement('a');
      a.href = modalImageData.url;
      a.download = `SD_History_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('已开始下载图片');
    }

    function clearHistory() {
      if (!confirm('确定清空所有本地生成历史？')) return;
      historyList = [];
      localStorage.removeItem('sd_history');
      renderHistory();
      showToast('历史记录已清空');
    }

    // =========================================================================
    // 全屏灯箱逻辑 (极大大图预览)
    // =========================================================================
    function openLightbox(url) {
      const targetUrl = url || (currentImageData && currentImageData.url);
      if (!targetUrl) return;
      document.getElementById('lightboxImg').src = targetUrl;
      document.getElementById('lightbox').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }

    function copyImageUrl() {
      if (!currentImageData) return;
      navigator.clipboard.writeText(currentImageData.url).then(() => {
        showToast('图片直链已复制到剪贴板');
      });
    }

    function copyPrompt() {
      if (!currentImageData) return;
      navigator.clipboard.writeText(currentImageData.prompt).then(() => {
        showToast('提示词已复制到剪贴板');
      });
    }

    function downloadImage() {
      if (!currentImageData) return;
      const a = document.createElement('a');
      a.href = currentImageData.url;
      a.download = `SD_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('已开始下载');
    }
  </script>
</body>
</html>
