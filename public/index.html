<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Studio · AI 绘图工作站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <script>
    const _warn = console.warn;
    console.warn = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _warn.apply(console, args);
    };
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
    button, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white font-sans antialiased overflow-x-hidden">

  <!-- 顶部导航栏 -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-md shrink-0">
          <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-base font-bold tracking-tight text-white whitespace-nowrap">Gemini Studio</span>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono whitespace-nowrap">炸天帮 API</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-500/20 px-2.5 py-1 rounded-full whitespace-nowrap">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-medium">就绪</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主工作区 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-5">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
      
      <!-- 左侧控制面板 (5 列) -->
      <div class="lg:col-span-5 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
          
          <!-- 模型选择器 -->
          <div>
            <label class="text-xs font-semibold text-slate-300 flex items-center justify-between mb-1.5">
              <span class="flex items-center gap-1.5">
                <i data-lucide="cpu" class="w-3.5 h-3.5 text-indigo-400"></i> 生图模型
              </span>
              <span class="text-[10px] text-indigo-400 font-mono">极速首选</span>
            </label>
            <select id="modelSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono cursor-pointer transition">
              <option value="gemini-3.1-flash-image" selected>⚡ gemini-3.1-flash-image (极速秒出 · 推荐)</option>
              <option value="gemini-3.1-flash-image-2K">✨ gemini-3.1-flash-image-2K (2K 高清平衡)</option>
              <option value="gemini-3.1-flash-image-4K">💎 gemini-3.1-flash-image-4K (4K 旗舰画质)</option>
            </select>
          </div>

          <!-- 提示词输入框 -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-xs font-semibold text-slate-200 flex items-center gap-1.5">
                <i data-lucide="wand-2" class="w-3.5 h-3.5 text-indigo-400"></i> 画面提示词 (Prompt)
              </label>
              <button onclick="clearPrompt()" class="text-xs text-slate-500 hover:text-slate-300 transition py-0.5 px-1.5">清空</button>
            </div>
            <textarea id="promptInput" rows="3" 
              placeholder="输入画面描述，支持中英文..." 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition resize-none leading-relaxed">a cute cyberpunk cat with neon sunglasses sitting on city roof, rain, 8k resolution</textarea>
            
            <!-- 预设灵感 -->
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              <span class="text-[11px] text-slate-500 mr-0.5 whitespace-nowrap">灵感:</span>
              <button onclick="setQuickPrompt('赛博朋克霓虹城市夜景，雨夜倒影，高楼大厦，电影级光影，8k高清')" class="text-[11px] bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700/60 transition whitespace-nowrap">赛博夜景</button>
              <button onclick="setQuickPrompt('穿着宇航服在深邃宇宙中漂浮的可爱猫咪，璀璨星系，杰作，8k')" class="text-[11px] bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700/60 transition whitespace-nowrap">宇航猫咪</button>
              <button onclick="setQuickPrompt('银发二次元美少女，樱花飞舞，夕阳海滩，唯美吉卜力风格')" class="text-[11px] bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700/60 transition whitespace-nowrap">唯美动漫</button>
              <button onclick="setQuickPrompt('3D可爱生肖龙盲盒手办，光滑塑料质感，马卡龙柔和配色，柔光Octane渲染')" class="text-[11px] bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700/60 transition whitespace-nowrap">3D潮玩</button>
            </div>
          </div>

          <!-- 画幅比例选择器 -->
          <div>
            <label class="text-xs font-semibold text-slate-200 flex items-center gap-1.5 mb-1.5">
              <i data-lucide="proportions" class="w-3.5 h-3.5 text-indigo-400"></i> 画幅比例
            </label>
            <div class="grid grid-cols-4 gap-2 text-center" id="ratioSelector">
              <button type="button" data-ratio="1:1" data-w="1024" data-h="1024" onclick="selectRatio(this)" class="ratio-btn bg-indigo-600/20 border-indigo-500/80 text-white border py-2 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1 cursor-pointer">
                <span class="text-xs font-mono">1:1</span>
                <span class="text-[10px] whitespace-nowrap">方形</span>
              </button>
              <button type="button" data-ratio="16:9" data-w="1920" data-h="1080" onclick="selectRatio(this)" class="ratio-btn bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200 border py-2 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1 cursor-pointer">
                <span class="text-xs font-mono">16:9</span>
                <span class="text-[10px] whitespace-nowrap">横屏壁纸</span>
              </button>
              <button type="button" data-ratio="9:16" data-w="1080" data-h="1920" onclick="selectRatio(this)" class="ratio-btn bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200 border py-2 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1 cursor-pointer">
                <span class="text-xs font-mono">9:16</span>
                <span class="text-[10px] whitespace-nowrap">手机壁纸</span>
              </button>
              <button type="button" data-ratio="4:3" data-w="1024" data-h="768" onclick="selectRatio(this)" class="ratio-btn bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200 border py-2 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1 cursor-pointer">
                <span class="text-xs font-mono">4:3</span>
                <span class="text-[10px] whitespace-nowrap">标准相册</span>
              </button>
            </div>
          </div>

          <!-- 折叠反向提示词 -->
          <div>
            <button onclick="toggleNegative()" class="flex items-center justify-between w-full text-xs text-slate-400 hover:text-slate-200 transition py-0.5">
              <span class="flex items-center gap-1.5 font-medium"><i data-lucide="shield-alert" class="w-3.5 h-3.5 text-slate-400"></i> 反向提示词 (可选)</span>
              <i id="negChevron" data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform"></i>
            </button>
            <div id="negativeWrapper" class="hidden mt-2">
              <textarea id="negativeInput" rows="2" 
                placeholder="排除不希望出现的元素，如：lowres, blurry, bad anatomy..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition resize-none"></textarea>
            </div>
          </div>

          <!-- 生成按钮 -->
          <button id="generateBtn" onclick="handleGenerate()" 
            class="w-full py-3.5 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span>立即生成图片</span>
          </button>
        </div>

        <!-- 极简外链调用 -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-400 space-y-1">
          <div class="flex items-center justify-between text-slate-300 font-medium">
            <span class="flex items-center gap-1.5"><i data-lucide="terminal" class="w-3.5 h-3.5 text-indigo-400"></i> 浏览器直出外链</span>
          </div>
          <div class="bg-slate-950 p-2 rounded font-mono text-[11px] text-slate-300 break-all select-all border border-slate-800">
            http://<span class="host-placeholder">localhost:3055</span>/image?prompt=cat
          </div>
        </div>
      </div>

      <!-- 右侧当前视口展示区 (7 列) -->
      <div class="lg:col-span-7 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col min-h-[460px]">
          
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
            <h3 class="text-xs sm:text-sm font-semibold text-slate-200 flex items-center gap-2">
              <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i> 画布视口
            </h3>
            <div id="metaBadge" class="hidden text-xs px-2.5 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 font-mono whitespace-nowrap">
              --
            </div>
          </div>

          <!-- 图片展示与加载视口 (固定比例与高度，杜绝抖动与乱行) -->
          <div id="displayViewport" class="flex-1 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center p-3 relative overflow-hidden group min-h-[340px]">
            
            <!-- 默认空状态 -->
            <div id="emptyState" class="text-center space-y-2 max-w-sm py-12 px-4">
              <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto mb-2">
                <i data-lucide="palette" class="w-6 h-6"></i>
              </div>
              <h4 class="text-slate-200 font-semibold text-sm">准备创作</h4>
              <p class="text-xs text-slate-400 leading-relaxed">在左侧输入提示词并点击生成，生成的画作将实时在此呈现。</p>
            </div>

            <!-- 加载状态动画 -->
            <div id="loadingState" class="hidden text-center space-y-3 py-16">
              <div class="relative w-14 h-14 mx-auto">
                <div class="absolute inset-0 rounded-full border-2 border-indigo-500/20"></div>
                <div class="absolute inset-0 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-indigo-400">
                  <i data-lucide="sparkles" class="w-5 h-5 animate-pulse"></i>
                </div>
              </div>
              <div class="space-y-0.5">
                <h4 class="text-sm text-slate-200 font-semibold">正在高速绘制中...</h4>
                <p class="text-xs text-slate-400">耗时 <span id="timerText" class="font-mono text-indigo-400 font-bold">0.0s</span></p>
              </div>
            </div>

            <!-- 错误状态提示卡片 -->
            <div id="errorState" class="hidden text-center space-y-3 py-10 max-w-md px-4">
              <div class="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
              </div>
              <div class="space-y-1">
                <h4 class="text-slate-200 font-semibold text-sm">生成未完成</h4>
                <p id="errorMsgText" class="text-xs text-rose-400/90 font-mono bg-rose-950/30 border border-rose-500/20 p-2 rounded-lg break-all"></p>
              </div>
              <button onclick="handleGenerate()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 重试
              </button>
            </div>

            <!-- 生成的图片展示 -->
            <img id="resultImage" class="hidden max-h-[480px] w-auto max-w-full rounded-lg object-contain shadow-2xl transition duration-300 cursor-zoom-in" onclick="openLightbox(this.src)" alt="Generated Output">
          </div>

          <!-- 快捷操作栏 -->
          <div id="actionToolbar" class="hidden mt-3 pt-3 border-t border-slate-800 grid grid-cols-2 sm:flex sm:flex-wrap sm:items-center sm:justify-between gap-2">
            <button onclick="openLightbox()" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center justify-center gap-1.5 transition">
              <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> 全屏预览
            </button>
            <button onclick="downloadImage()" class="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium flex items-center justify-center gap-1.5 transition">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> 下载原图
            </button>
            <button onclick="copyImageUrl()" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center justify-center gap-1.5 transition">
              <i data-lucide="link" class="w-3.5 h-3.5"></i> 复制直链
            </button>
            <button onclick="copyPrompt()" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center justify-center gap-1.5 transition">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i> 复制提示词
            </button>
          </div>
        </div>

        <!-- 本地作品画廊 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <div class="flex items-center justify-between mb-3">
            <h4 class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
              <i data-lucide="history" class="w-3.5 h-3.5 text-indigo-400"></i> 本地历史 (<span id="historyCount">0</span>)
              <span class="text-[11px] text-slate-500 font-normal hidden sm:inline">· 点击弹窗查看</span>
            </h4>
            <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-rose-400 transition py-0.5 px-1.5">清空记录</button>
          </div>
          <div id="historyGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
            <!-- 缩略图由 JS 渲染 -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- 历史图片弹出查看窗口 -->
  <div id="historyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-6" onclick="closeHistoryModal()">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          <h3 class="text-xs sm:text-sm font-semibold text-slate-200">历史详情</h3>
          <span id="modalMetaBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">--</span>
        </div>
        <button onclick="closeHistoryModal()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-3 sm:p-5 overflow-y-auto flex-1 space-y-3">
        <div class="rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden min-h-[200px] max-h-[460px]">
          <img id="modalImage" class="max-h-[460px] w-auto max-w-full object-contain cursor-zoom-in" onclick="openLightbox(this.src)" alt="Historical Image">
        </div>
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-300">生成提示词:</span>
            <button onclick="copyModalPrompt()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition">
              <i data-lucide="copy" class="w-3 h-3"></i> 复制
            </button>
          </div>
          <p id="modalPromptText" class="text-xs text-slate-300 font-mono select-all bg-slate-900 p-2 rounded-lg border border-slate-800 break-all"></p>
        </div>
      </div>

      <div class="px-4 py-3 border-t border-slate-800 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2">
        <button onclick="applyModalPrompt()" class="px-3 py-2 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-medium flex items-center justify-center gap-1 transition cursor-pointer">
          <i data-lucide="arrow-left-circle" class="w-4 h-4"></i> 复用提示词
        </button>
        <div class="grid grid-cols-3 sm:flex sm:items-center gap-2">
          <button onclick="copyModalImageUrl()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center justify-center gap-1 transition cursor-pointer">
            <i data-lucide="link" class="w-3.5 h-3.5"></i> 复制直链
          </button>
          <button onclick="downloadModalImage()" class="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center justify-center gap-1 transition cursor-pointer">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> 下载
          </button>
          <button onclick="closeHistoryModal()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center justify-center transition cursor-pointer">
            关闭
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全屏灯箱 -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-3" onclick="closeLightbox()">
    <button class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition cursor-pointer" onclick="closeLightbox()">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    <img id="lightboxImg" class="max-w-full max-h-[92vh] rounded-xl shadow-2xl object-contain" onclick="event.stopPropagation()" alt="Full view">
  </div>

  <!-- Toast 提示框 -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 max-w-[90vw]">
    <i id="toastIcon" data-lucide="check-circle" class="w-4 h-4 text-emerald-400 shrink-0"></i>
    <span id="toastMsg" class="truncate">成功</span>
  </div>

  <script>
    lucide.createIcons();

    document.querySelectorAll('.host-placeholder').forEach(el => {
      el.innerText = window.location.host;
    });

    let currentImageData = null;
    let modalImageData = null;
    let selectedW = 1024;
    let selectedH = 1024;
    let selectedRatio = '1:1';
    let timerInterval = null;
    let historyList = JSON.parse(localStorage.getItem('gemini_history_classic') || '[]');

    renderHistory();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeHistoryModal();
        closeLightbox();
      }
    });

    function setQuickPrompt(text) {
      document.getElementById('promptInput').value = text;
      document.getElementById('promptInput').focus();
    }

    function clearPrompt() {
      document.getElementById('promptInput').value = '';
      document.getElementById('promptInput').focus();
    }

    function toggleNegative() {
      const wrap = document.getElementById('negativeWrapper');
      const chev = document.getElementById('negChevron');
      wrap.classList.toggle('hidden');
      chev.classList.toggle('rotate-180');
    }

    function selectRatio(btn) {
      document.querySelectorAll('.ratio-btn').forEach(b => {
        b.className = "ratio-btn bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200 border py-2 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1 cursor-pointer";
      });
      btn.className = "ratio-btn bg-indigo-600/20 border-indigo-500/80 text-white border py-2 rounded-xl text-xs font-medium transition flex flex-col items-center gap-1 cursor-pointer";
      selectedRatio = btn.getAttribute('data-ratio') || '1:1';
      selectedW = Number(btn.getAttribute('data-w'));
      selectedH = Number(btn.getAttribute('data-h'));
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.innerText = msg;
      toastIcon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
      toastIcon.className = `w-4 h-4 ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
      lucide.createIcons();

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    async function handleGenerate() {
      const prompt = document.getElementById('promptInput').value.trim();
      const negative_prompt = document.getElementById('negativeInput').value.trim();

      if (!prompt) {
        showToast('请输入提示词 (Prompt)', true);
        return document.getElementById('promptInput').focus();
      }

      const generateBtn = document.getElementById('generateBtn');
      const emptyState = document.getElementById('emptyState');
      const loadingState = document.getElementById('loadingState');
      const errorState = document.getElementById('errorState');
      const errorMsgText = document.getElementById('errorMsgText');
      const resultImage = document.getElementById('resultImage');
      const actionToolbar = document.getElementById('actionToolbar');
      const metaBadge = document.getElementById('metaBadge');
      const timerText = document.getElementById('timerText');

      generateBtn.disabled = true;
      emptyState.classList.add('hidden');
      errorState.classList.add('hidden');
      resultImage.classList.add('hidden');
      actionToolbar.classList.add('hidden');
      loadingState.classList.remove('hidden');

      const startTime = Date.now();
      timerText.innerText = '0.0s';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerText.innerText = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
      }, 100);

      try {
        const model = document.getElementById('modelSelect')?.value || 'gemini-3.1-flash-image';
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            negative_prompt,
            model,
            aspect_ratio: selectedRatio,
            width: selectedW,
            height: selectedH
          })
        });

        const data = await response.json();
        clearInterval(timerInterval);

        const imgUrl = data.url;

        if (response.ok && data.success && imgUrl) {
          const cost = ((Date.now() - startTime) / 1000).toFixed(1);
          
          currentImageData = {
            url: imgUrl,
            prompt,
            cost,
            model: data.model || model,
            ratio: selectedRatio,
          };

          resultImage.src = imgUrl;
          resultImage.classList.remove('hidden');
          actionToolbar.classList.remove('hidden');
          
          metaBadge.innerText = `${(data.model || model).replace('gemini-', '')} · ${selectedRatio} · ${cost}s`;
          metaBadge.classList.remove('hidden');

          saveToHistory(currentImageData);
          showToast(`绘制成功！耗时 ${cost} 秒`);
        } else {
          errorState.classList.remove('hidden');
          errorMsgText.innerText = data.error || ('HTTP ' + response.status + ': 生成失败');
          showToast(data.error || '生成失败，请重试', true);
        }
      } catch (err) {
        clearInterval(timerInterval);
        errorState.classList.remove('hidden');
        errorMsgText.innerText = '连接超时或异常: ' + err.message;
        showToast('请求异常: ' + err.message, true);
      } finally {
        generateBtn.disabled = false;
        loadingState.classList.add('hidden');
        lucide.createIcons();
      }
    }

    function saveToHistory(item) {
      historyList.unshift({
        id: Date.now(),
        ...item
      });
      if (historyList.length > 30) historyList.pop();
      try {
        localStorage.setItem('gemini_history_classic', JSON.stringify(historyList));
      } catch (e) {}
      renderHistory();
    }

    function renderHistory() {
      const grid = document.getElementById('historyGrid');
      const countEl = document.getElementById('historyCount');
      countEl.innerText = historyList.length;

      if (historyList.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-6 text-center text-xs text-slate-500">暂无作品记录</div>`;
        return;
      }

      grid.innerHTML = historyList.map((item, idx) => `
        <div class="group relative aspect-square rounded-xl overflow-hidden bg-slate-950 border border-slate-800 hover:border-indigo-500/60 transition shadow-sm cursor-pointer" onclick="openHistoryModal(${idx})">
          <img src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" alt="History Item">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition p-2 flex flex-col justify-end">
            <span class="text-[10px] text-indigo-300 font-mono truncate">${item.ratio || '1:1'}</span>
            <span class="text-[9px] text-slate-400 font-mono">${item.cost || '--'}s</span>
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (!confirm('确定清空所有本地生成历史记录吗？')) return;
      historyList = [];
      localStorage.removeItem('gemini_history_classic');
      renderHistory();
      showToast('历史记录已清空');
    }

    function openHistoryModal(index) {
      const item = historyList[index];
      if (!item) return;

      modalImageData = item;
      document.getElementById('modalImage').src = item.url;
      document.getElementById('modalPromptText').innerText = item.prompt || '(无提示词)';
      document.getElementById('modalMetaBadge').innerText = `${item.model || 'gemini'} · ${item.ratio || ''} · ${item.cost || ''}s`;

      const modal = document.getElementById('historyModal');
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function applyModalPrompt() {
      if (modalImageData && modalImageData.prompt) {
        document.getElementById('promptInput').value = modalImageData.prompt;
        closeHistoryModal();
        showToast('已填入提示词到输入框');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function copyModalPrompt() {
      if (!modalImageData || !modalImageData.prompt) return;
      navigator.clipboard.writeText(modalImageData.prompt);
      showToast('历史提示词已复制');
    }

    function copyModalImageUrl() {
      if (!modalImageData || !modalImageData.url) return;
      navigator.clipboard.writeText(modalImageData.url);
      showToast('图片直链已复制');
    }

    function downloadModalImage() {
      if (!modalImageData || !modalImageData.url) return;
      const a = document.createElement('a');
      a.href = modalImageData.url;
      a.download = `gemini-history-${Date.now()}.jpg`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyImageUrl() {
      if (!currentImageData || !currentImageData.url) return;
      navigator.clipboard.writeText(currentImageData.url);
      showToast('图片直链已复制');
    }

    function copyPrompt() {
      if (!currentImageData || !currentImageData.prompt) return;
      navigator.clipboard.writeText(currentImageData.prompt);
      showToast('提示词已复制');
    }

    function downloadImage() {
      if (!currentImageData || !currentImageData.url) return;
      const a = document.createElement('a');
      a.href = currentImageData.url;
      a.download = `gemini-${Date.now()}.jpg`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function openLightbox(src) {
      const url = src || currentImageData?.url;
      if (!url) return;
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }
  </script>
</body>
</html>
